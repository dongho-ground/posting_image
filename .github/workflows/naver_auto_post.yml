name: 24/7 Naver Blog Cloud Auto Publisher

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [naver_post]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Execute 24/7 Naver Blog Publishing
        env:
          NAVER_ID: ${{ secrets.NAVER_ID || 'wonrexander' }}
          NAVER_PW: ${{ secrets.NAVER_PW || 'iamwon84^^!@' }}
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8858081744:AAFbsEkJeuJeo4ccgzK3J6zHlxuZu4-aLto' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1598288296' }}
        run: |
          node publish_naver_cloud.mjs

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-proof-screenshot
          path: github_actions_published_proof.png
          if-no-files-found: ignore