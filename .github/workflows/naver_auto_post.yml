name: 24/7 Multi-Blog Cloud Auto Publisher

on:
  schedule:
    # Monday to Friday at 13:00 KST (04:00 UTC)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Publishing Target (naver, tistory_account, tistory_adsense)'
        required: true
        default: 'naver'
  repository_dispatch:
    types: [naver_post, tistory_account_post, tistory_adsense_post]

jobs:
  publish_naver:
    if: github.event.action == 'naver_post' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target_platform == 'naver')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
      - name: Execute 24/7 Naver Blog Publishing
        env:
          NAVER_ID: ${{ secrets.NAVER_ID || 'wonrexander' }}
          NAVER_PW: ${{ secrets.NAVER_PW || 'iamwon84^^!@' }}
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8858081744:AAFbsEkJeuJeo4ccgzK3J6zHlxuZu4-aLto' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1598288296' }}
        run: node publish_naver_cloud.mjs
      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-publishing-proof
          path: github_actions_published_proof.png
          if-no-files-found: ignore

  publish_tistory_account:
    if: github.event.action == 'tistory_account_post' || (github.event_name == 'workflow_dispatch' && inputs.target_platform == 'tistory_account')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
      - name: Execute 24/7 Tistory Account (B2B) Publishing
        env:
          TISTORY_TAB: 'Account'
          TISTORY_ID: ${{ secrets.TISTORY_ID || 'skymard@hanmail.net' }}
          TISTORY_PW: ${{ secrets.TISTORY_PW || 'iamwon84^^@' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8858081744:AAFbsEkJeuJeo4ccgzK3J6zHlxuZu4-aLto' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1598288296' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node publish_tistory_cloud.mjs
      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-account-proof
          path: tistory_published_proof.png
          if-no-files-found: ignore

  publish_tistory_adsense:
    if: github.event.action == 'tistory_adsense_post' || (github.event_name == 'workflow_dispatch' && inputs.target_platform == 'tistory_adsense')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
      - name: Execute 24/7 Tistory AdSense (Traffic) Publishing
        env:
          TISTORY_TAB: 'adsens'
          TISTORY_ID: ${{ secrets.TISTORY_ID || 'skymard@hanmail.net' }}
          TISTORY_PW: ${{ secrets.TISTORY_PW || 'iamwon84^^@' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8858081744:AAFbsEkJeuJeo4ccgzK3J6zHlxuZu4-aLto' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1598288296' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node publish_tistory_cloud.mjs
      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-adsense-proof
          path: tistory_published_proof.png
          if-no-files-found: ignore